[manifest]
version = "1.0.0"
dump_lua = true
priority = -23

[[patches]]
[patches.pattern]
target = "back.lua"
pattern = "self.name = selected_back.name or 'Red Deck'"
position = "after"
payload = '''
if not selected_back.unlocked then
    self.atlas = 'uncardable_locked_deck'
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "back.lua"
pattern = '''local pos = (self.effect.center.unlocked and self.effect.center.pos) or {x = 4, y = 0}'''
position = "after"
payload = '''
if not selected_back.unlocked then
    pos = {x = 0, y = 0}
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "back.lua"
pattern = "self.name = new_back.name or 'Red Deck'"
position = "after"
payload = '''
if not new_back.unlocked then
    self.atlas = 'uncardable_locked_deck'
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "back.lua"
pattern = '''local pos = self.effect.center.unlocked and copy_table(new_back.pos) or {x = 4, y = 0}'''
position = "after"
payload = '''
if not new_back.unlocked or not self.effect.center.unlocked then
    pos = {x = 0, y = 0}
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "boot_timer('splash prep', 'end',1)"
position = "after"
payload = '''
if SMODS.find_mod("uncardable") then
    self.shared_soul = Sprite(0, 0, self.CARD_W, self.CARD_H, self.ASSET_ATLAS['uncardable_c_soul_soul'], {x = 0, y = 0})
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''G.SPLASH_LOGO = Sprite(0, 0, 
        13*SC_scale, 
        13*SC_scale*(G.ASSET_ATLAS["balatro"].py/G.ASSET_ATLAS["balatro"].px),
        G.ASSET_ATLAS["balatro"], {x=0,y=0})'''
position = "after"
payload = '''
if not UNCARDABLE.config.reduced_anims then
    G.SPLASH_LOGO = SMODS.create_sprite(0, 0, 
        13*SC_scale, 
        13*SC_scale*216/333,
            G.ANIMATION_ATLAS["uncardable_balatro_anim"], {x=0,y=0})
end
'''
match_indent = true